<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendário de férias</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--ink:#16202e;--mu:#5d6b82;--ln:#dde2ea}
@media (prefers-color-scheme:dark){:root{--bg:#0c1320;--sf:#141d2e;--ink:#e6ebf5;--mu:#9aa8c2;--ln:#25314a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:24px;margin:4px 0 2px}.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;min-height:40px;padding:0 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink)}
.pan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0}.pc{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.pl{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:14px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.mo{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.d7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px;text-align:center;font-size:12px}.d7 i{font-style:normal;color:var(--mu)}
.dy{padding:4px 0;border-radius:4px}.dy.t{outline:2px solid var(--ink)}.dy.c{color:#fff;font-weight:600;text-shadow:0 0 2px rgba(0,0,0,.6)}
h3{font-size:15px;margin:20px 0 6px}.li{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;margin:6px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style></head><body><div class="w"><h1>Calendário de férias</h1><div class="mu" id="sub">Carregando…</div>
<div class="row"><button id="pv">◀</button><b id="yr" style="font-size:18px"></b><button id="nx">▶</button><select id="fc" aria-label="Loja"></select></div>
<div class="pan" id="pn"></div><div class="lg" id="lg"></div><div class="cal" id="cal"></div><h3 id="lh"></h3><div id="ls"></div></div>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),br=d=>d.split('-').reverse().join('/');
const add=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const now=new Date(),today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());let cy=+today.slice(0,4),R=[];
const names=[],col=n=>{let i=names.indexOf(n);if(i<0){names.push(n);i=names.length-1}return`hsl(${(i*47)%360} 55% 42%)`};
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function draw(){const f=$('fc').value,rows=R.filter(r=>!f||r.e===f),map={};$('yr').textContent=cy;
rows.forEach(r=>{for(let j=0;j<r.d;j++){const d=add(r.i,j);if(+d.slice(0,4)===cy)(map[d]=map[d]||[]).includes(r.n)||map[d].push(r.n)}});
const fim=r=>add(r.i,r.d-1),nm=r=>r.n+(f?'':' <span class="mu">· '+r.e+'</span>'),none='<span class="mu">Ninguém.</span>';
const hoje=rows.filter(r=>r.i<=today&&fim(r)>=today),prox=rows.filter(r=>r.i>today&&r.i<=add(today,30)).sort((a,b)=>a.i<b.i?-1:1);
$('pn').innerHTML=`<div class="pc"><b>De férias hoje</b>${hoje.length?hoje.map(r=>`<div class="pl"><span>${nm(r)}</span><span class="mu">até ${br(fim(r))}</span></div>`).join(''):none}</div><div class="pc"><b>Saem nos próximos 30 dias</b>${prox.length?prox.map(r=>`<div class="pl"><span>${nm(r)}</span><span class="mu">${br(r.i)} · ${r.d} d</span></div>`).join(''):none}</div>`;
const us=[...new Set(Object.values(map).flat())];$('lg').innerHTML=us.length?us.map(n=>`<span><i style="background:${col(n)}"></i>${n}</span>`).join(''):'<span class="mu">Nenhuma férias com data neste ano.</span>';
let h='';for(let m=0;m<12;m++){const dow=new Date(Date.UTC(cy,m,1)).getUTCDay(),nd=new Date(Date.UTC(cy,m+1,0)).getUTCDate();
h+=`<div class="mo"><b>${M[m]}</b><div class="d7">`+['D','S','T','Q','Q','S','S'].map(x=>`<i>${x}</i>`).join('')+'<span></span>'.repeat(dow);
for(let d=1;d<=nd;d++){const ds=`${cy}-${pad(m+1)}-${pad(d)}`,a=map[ds]||[];let st='',cl='dy'+(ds===today?' t':'');
if(a.length){cl+=' c';const n=a.length;st=n==1?`background:${col(a[0])}`:`background:linear-gradient(90deg,${a.map((x,k)=>`${col(x)} ${k*100/n}% ${(k+1)*100/n}%`).join(',')})`}
h+=`<div class="${cl}" style="${st}" title="${a.join(' / ')}">${d}</div>`}h+='</div></div>'}
$('cal').innerHTML=h;
const L=rows.filter(r=>r.i.slice(0,4)==cy||fim(r).slice(0,4)==cy).sort((a,b)=>a.i<b.i?-1:1);$('lh').textContent='Férias de '+cy;
$('ls').innerHTML=L.length?L.map(r=>`<div class="li"><span><b>${r.n}</b> <span class="mu">· ${r.e}</span></span><span>${br(r.i)} a ${br(fim(r))} · ${r.d} dias</span></div>`).join(''):'<p class="mu">Sem férias com data neste ano.</p>'}
$('pv').onclick=()=>{cy--;draw()};$('nx').onclick=()=>{cy++;draw()};$('fc').onchange=draw;
(async()=>{try{const{data,error}=await parent.__sb.rpc('calendario_publico');if(error)throw error;R=data||[];
const lj=[...new Set(R.map(r=>r.e))].sort();$('fc').innerHTML='<option value="">Todas as lojas</option>'+lj.map(l=>`<option>${l}</option>`).join('');
$('sub').textContent='Quem está de férias e quando.';draw()}catch(e){$('sub').textContent='Não foi possível carregar o calendário. Recarregue a página.'}})();
</script></body></html>
