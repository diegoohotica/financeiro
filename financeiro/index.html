let nt=0;files.filter(f=>f.tot).forEach(f=>{T=T.filter(t=>!(t.month===f.month&&t.loja===f.loja));f.items.forEach(x=>{T.push({id:Date.now()+''+Math.random().toString(36).slice(2,8),month:f.month,loja:f.loja,source:'Ssotica',label:x.label,method:x.method,brand:x.brand,amount:x.amount});nt++});(f.items.days||[]).forEach(d=>{D=D.filter(e=>!(e.agg&&e.source==='Ssotica'&&e.date===d.date&&e.loja===f.loja));d.items.forEach(x=>{D.push({id:Date.now()+''+Math.random().toString(36).slice(2,8),date:d.date,type:'in',source:'Ssotica',loja:f.loja,method:x.method,brand:x.brand,amount:x.amount,cat:'Resumo do dia',desc:'Resumo do dia · '+x.label,agg:true});nt++})});sel=f.month+'-01';fp='mes'});if(nt){saveT();save()}
const mk=()=>Date.now()+''+Math.random().toString(36).slice(2,8);let n=0,rm=0,sk=0,first=null;
const k=e=>[e.date,e.hora||'',e.loja||'',e.source,e.type,(+e.amount).toFixed(2),e.desc||''].join('|'),canc=new Set(D.filter(e=>e.canc).map(k));
files.filter(f=>!f.tot).forEach(f=>{const it=fItems(f);if(!it.length)return;const ds=new Set(it.map(x=>x.date)),ty=new Set(it.map(x=>x.type)),lj=f.loja||'',isV=it.some(x=>x.vend);
const before=D.length;D=D.filter(e=>!(e.source===f.src&&((e.loja||'')===lj||!e.loja)&&ds.has(e.date)&&!!e.vend===isV&&!e.agg&&!e.adj&&!e.canc&&!e.manual&&ty.has(e.type)));rm+=before-D.length;

msg((nt?'Total do período importado ('+nt+' formas). ':'')+(n||!nt?n+' lançamentos importados':'')+(rm?' ('+rm+' antigos dos mesmos dias foram substituídos)':'')+'.'+(sk?' '+sk+' cancelados por você foram mantidos fora.':''))}

if(!n)return `<details class="cd"><summary>Apagar o mês</summary><span class="mu">Não há nada guardado em ${mname(x.m)} (${esc(esc_)}).</span></details>`;
return `<details class="cd" ${wipe==='M'?'open':''}><summary>Apagar o mês todo</summary><span class="mu">Apaga os lançamentos, o total do período e os saldos do caixa de <b>${mname(x.m)}</b> (${esc(esc_)}). Para trocar o mês, use o seletor do Painel. Os outros meses não são mexidos.</span>

${wipe==='M'?`<div class="stt bad">Apagar tudo de ${mname(x.m)}? Não dá para desfazer.</div><div class="g"><button class="b" onclick="wGo()">Sim, apagar o mês</button><button class="s" onclick="wNo()">Cancelar</button></div>`:`${DL?'<button class="s" onclick="bkp()">Baixar backup antes (.json)</button>':''}<button class="s" onclick="wAsk('M')">Apagar ${mname(x.m)}</button>`}</details>`}
function outSel(all){const m=sel.slice(0,7);return D.filter(e=>e.type==='out'&&inL(e)&&(all||e.date.startsWith(m)))}
function outCard(){const a=outSel(false),b=outSel(true),m=mname(sel.slice(0,7)),esc_=LF?ljName(LF):'todas as lojas';
const ask=(k,n,txt)=>wipe===k?`<div class="stt bad">Apagar ${n} lançamento(s) de ${txt}? Não dá para desfazer. As entradas não são mexidas.</div><div class="g"><button class="b" onclick="wGo()">Sim, apagar</button><button class="s" onclick="wNo()">Cancelar</button></div>`:(n?`<button class="s" onclick="wAsk('${k}')">Apagar ${txt}</button>`:'');
return `<details class="cd" ${wipe==='OM'||wipe==='OA'?'open':''}><summary>Apagar contas pagas</summary><span class="mu">Apaga só as despesas (${esc(esc_)}). Entradas, totais do período e saldos do caixa ficam como estão.</span>
<div class="li"><span>${m}</span><span class="mono">${a.length}</span></div><div class="li"><span>Todos os meses</span><span class="mono">${b.length}</span></div>
${a.length||b.length?'':'<span class="mu">Não há contas pagas guardadas.</span>'}${ask('OM',a.length,'contas pagas de '+m)}${ask('OA',b.length,'todas as contas pagas')}</details>`}
function wGo(){const k=wipe;wipe=null;
if(k==='CM'){const x=D.filter(e=>isCM(e)&&inL(e)),ids=new Set(x.map(e=>e.id));D=D.filter(e=>!ids.has(e.id));save();render();msg(x.length+' Pix de CENTRO MARICÁ apagados.');return}
if(k==='OM'||k==='OA'){const x=outSel(k==='OA'),ids=new Set(x.map(e=>e.id));D=D.filter(e=>!ids.has(e.id));save();render();msg(x.length+' conta(s) paga(s) apagada(s).');return}
if(k==='M'){const x=mesSel(),ids=new Set(x.d.map(e=>e.id)),tid=new Set(x.t.map(t=>t.id));D=D.filter(e=>!ids.has(e.id));T=T.filter(t=>!tid.has(t.id));x.c.forEach(q=>delete C[q]);save();saveT();saveC();render();msg(mname(x.m)+' apagado: '+x.d.length+' lançamentos.');return}
if(k==='D'||k==='all'){D=D.filter(()=>false);save()}
if(k==='T'||k==='all'){T=[];saveT()}

function dadosCard(){const so={},mo={};D.forEach(e=>{const k=e.source+' · '+(e.type==='out'?'despesa':'entrada');(so[k]=so[k]||{n:0,v:0}).n++;so[k].v+=e.amount;const m=e.date.slice(0,7);(mo[m]=mo[m]||{n:0}).n++});
const tg={};T.forEach(t=>{const k=t.month+'|'+(t.loja||'');(tg[k]=tg[k]||{m:t.month,l:t.loja||'',n:0,v:0}).n++;tg[k].v+=t.amount});
const tl=Object.values(tg).sort((a,b)=>b.m.localeCompare(a.m)),cn=Object.keys(C).length;
const ask=(k,txt)=>wipe===k?`<div class="stt bad">Apagar ${txt}? Não dá para desfazer.</div><div class="g"><button class="b" onclick="wGo()">Sim, apagar</button><button class="s" onclick="wNo()">Cancelar</button></div>`:`<button class="s" onclick="wAsk('${k}')">Apagar ${txt}</button>`;
return mesCard()+`<details class="cd"><summary>Dados guardados neste navegador</summary><span class="mu">Tudo o que o painel está somando. Se aparecer um valor que você não reconhece, ele está em uma destas listas.</span>

${DL?'<button class="s" onclick="bkp()">Baixar backup (.json)</button>':''}

async function rst(f){if(!f)return;try{const j=JSON.parse(await f.text()),a=Array.isArray(j)?j:(j.D||[]),ids=new Set(D.map(e=>e.id)),tids=new Set(T.map(e=>e.id));(Array.isArray(j)?[]:(j.T||[])).forEach(t=>{if(t&&t.id&&!tids.has(t.id))T.push(t)});Object.entries(j.C||{}).forEach(([k,v])=>{if(!(k in C))C[k]=v});saveC();saveT();let n=0;a.forEach(e=>{if(e&&e.id&&e.date&&e.amount&&!ids.has(e.id)){D.push(e);n++}});save();render();msg(n+' lançamentos restaurados.')}catch(e){msg('Arquivo de backup inválido.')}}

function seedDemo(){let sd=11;const r=()=>(sd=sd*16807%2147483647)/2147483647,ri=(a,b)=>a+Math.floor(r()*(b-a+1)),r2=x=>Math.round(x*100)/100,id=()=>'x'+(sd++)+Math.random().toString(36).slice(2,6);
const now=new Date(),Y=now.getFullYear(),M=now.getMonth()+1,last=Math.min(now.getDate(),30),NM=['Marcia Lima','Brasil Doces','Leandro Souza','Elisangela Reis','Viviane Costa','Ibrahim Silva','Adriana Matos','Claudia Andrade'],BRS=['Mastercard','Visa','Elo'],push=o=>D.push({id:id(),demo:true,brand:'',desc:'',cat:'',hora:'',cli:'',os:'',...o});
['OH! ICARAÍ','OH! CENTRO'].forEach((lj,li)=>{for(let d=1;d<=last;d++){const dt=new Date(Y,M-1,d);if(dt.getDay()===0)continue;const k=Y+'-'+pad(M)+'-'+pad(d);
for(let i=0;i<(li?ri(1,2):ri(2,4));i++){const v=r2(ri(60,900)+ri(0,99)/100),nm=NM[ri(0,NM.length-1)],base={date:k,type:'in',loja:lj,method:'Pix',amount:v};

push({...base,source:'Stone',desc:'Pix '+nm,cli:nm});if(!skipSs)push({...base,source:'Ssotica',amount:diff?r2(v+45):v,cli:nm,os:String(ri(1000,9999)),cat:'Vendas',hora:pad(ri(9,17))+':'+pad(ri(0,59)),dest:'Banco'})}
if(li===0&&d===18)push({date:k,type:'in',loja:lj,method:'Pix',amount:230,source:'Ssotica',cli:'Cliente sem Pix na Stone',cat:'Vendas',hora:'15:20'});
for(let i=0;i<ri(1,3);i++){const v=r2(ri(120,1800)+ri(0,99)/100),me=r()>.5?'Crédito':'Débito',br=BRS[ri(0,2)],base={date:k,type:'in',loja:lj,method:me,brand:br,amount:v};
push({...base,source:'Ssotica',cli:NM[ri(0,7)],cat:'Vendas',os:String(ri(1000,9999)),hora:pad(ri(9,17))+':'+pad(ri(0,59))});if(!(li===0&&d===15&&i===0)&&d<last-1)push({...base,source:'Stone',vend:true,desc:'Venda cartão '+me+' '+br})}}});
[4,9,15,21,26].filter(d=>d<=last).forEach((d,i)=>{const k=Y+'-'+pad(M)+'-'+pad(d),v=r2(ri(150,700)+.5);push({date:k,type:'in',loja:'OH! ICARAÍ',method:'Mumbuca',amount:v,source:'Mumbuca',cli:NM[i]});if(i!==3)push({date:k,type:'in',loja:'OH! ICARAÍ',method:'Mumbuca',amount:v,source:'Ssotica',cli:NM[i],cat:'Vendas',hora:'11:10'})});

save()}
